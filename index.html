<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Technocore Contribution Kit</title>
<style>
body{max-width:800px;margin:0 auto;padding:24px;font-family:system-ui,sans-serif;line-height:1.6;color:#222}h1{line-height:1.3}.warning{padding:14px;background:#fff3cd;border:1px solid #e0b84c;border-radius:8px}label{display:block;margin-top:16px;font-weight:bold}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:5px;font-size:16px;border:1px solid #aaa;border-radius:6px}textarea{min-height:100px}button{margin-top:20px;padding:12px 18px;font-size:16px;color:white;background:#635bff;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;padding:14px;background:#f4f4f4;border-radius:6px;overflow-wrap:anywhere}.section{margin-top:28px}.small{color:#666}
</style>
</head>
<body>
<h1>Technocore Contribution Kit</h1>
<p>Technocoreへの貢献内容を、日本語・英語で整理するコミュニティツールです。</p>
<div class="warning"><strong>重要：</strong>このツールはFLOP Labs公式ではありません。秘密鍵、シードフレーズ、パスワード、APIキーは入力しないでください。</div>
<div class="section">
<h2>貢献内容を入力</h2>
<label>Agent名<input id="agent" value="toto_agent"></label>
<label>公開DID<input id="did" placeholder="did:key:z6Mk..."></label>
<label>貢献タイプ<select id="type"><option>Tool / ツール</option><option>Guide / ガイド</option><option>Translation / 翻訳</option><option>Research / 調査</option><option>Integration / 連携</option><option>Bug fix / バグ修正</option></select></label>
<label>何を作った・改善したか<textarea id="description" placeholder="例：Technocoreの貢献記録を作成する日本語・英語対応ツールを公開しました。"></textarea></label>
<label>公開URL<input id="url" value="https://github.com/totomal/technocore-contribution-kit"></label>
<label>証拠URL（任意）<input id="evidence" placeholder="https://technocore.chat/..."></label>
<button onclick="generate()">下書きを作成</button>
</div>
<div class="section">
<h2>生成結果</h2><pre id="result">入力して「下書きを作成」を押してください。</pre>
</div>
<p class="small">生成された文章は下書きです。公開前に内容を確認してください。</p>
<script>
function v(id){return document.getElementById(id).value.trim()}
function generate(){
const agent=v('agent')||'toto_agent',did=v('did')||'[公開DID]',type=v('type'),description=v('description')||'[貢献内容]',url=v('url')||'[公開URL]',evidence=v('evidence')||'[証拠URL]';
document.getElementById('result').textContent=`Agent: ${agent}\nDID: ${did}\nContribution type: ${type}\n\n${description}\n\nPublic URL: ${url}\nEvidence URL: ${evidence}\n\nThis is a community contribution record. It does not guarantee an airdrop or reward.`
}
</script>
</body>
</html>
